name: Windows compatibility
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF dependency
        run: python -m pip install -r requirements.txt
      - name: Check documentation links and images
        run: python tools/check_docs.py
      - name: Test application and Windows launcher
        run: python -m unittest discover -s tests -v
      - name: Test participation and review state
        run: node --test tests/study-state.test.cjs
      - name: Parse Windows PowerShell installer
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'windows\Install-PietEducator.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Verify installer payload without installing software
        shell: powershell
        run: |
          . .\windows\Install-PietEducator.ps1 -ValidateOnly
          $Python = Find-Python
          if (-not $Python) { throw 'Installer did not detect the installed Python runtime.' }
          Invoke-Checked $Python @('-c', "import sys; print('Windows Python invocation works')")
